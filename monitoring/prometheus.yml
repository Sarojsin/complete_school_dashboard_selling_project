apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: college-management
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s

    rule_files:
      - /etc/prometheus/alert_rules.yml

    alerting:
      alertmanagers:
      - static_configs:
        - targets:
          # - alertmanager:9093

    scrape_configs:
    - job_name: 'college-management-web'
      static_configs:
      - targets: ['college-management-web:8000']
      metrics_path: /metrics
      scrape_interval: 15s
      scrape_timeout: 10s

    - job_name: 'postgres-school'
      static_configs:
      - targets: ['school-postgres:5432']
      scrape_interval: 30s

    - job_name: 'postgres-college'
      static_configs:
      - targets: ['college-postgres:5432']
      scrape_interval: 30s

    - job_name: 'redis'
      static_configs:
      - targets: ['redis:6379']
      scrape_interval: 30s

    alert_rules.yml: |
      groups:
      - name: college_management_alerts
        rules:
        - alert: HighErrorRate
          expr: rate(http_requests_total{status_code=~"5.."}[5m]) > 0.1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "High error rate detected"
            description: "Error rate is {{ $value }} errors per second for {{ $labels.path }}"

        - alert: HighResponseTime
          expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High response time detected"
            description: "95th percentile response time is {{ $value }}s"

        - alert: DatabaseConnectionIssues
          expr: up{job=~"postgres-.*"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Database connection lost"
            description: "Database {{ $labels.instance }} is down"

        - alert: RedisConnectionIssues
          expr: up{job="redis"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Redis connection lost"
            description: "Redis cache is unavailable"

        - alert: LowDiskSpace
          expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Low disk space"
            description: "Disk space is below 10% on {{ $labels.instance }}"

        - alert: HighMemoryUsage
          expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage"
            description: "Memory usage is above 90% on {{ $labels.instance }}"

        - alert: HighCPUUsage
          expr: rate(node_cpu_seconds_total{mode!="idle"}[5m]) > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage"
            description: "CPU usage is above 80% on {{ $labels.instance }}"