version: '3.8'

services:
  # PostgreSQL databases (dual database architecture)
  school_db:
    image: postgres:15-alpine
    container_name: college-management-school-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_sell_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - school_db_data:/var/lib/postgresql/data
      - ./scripts/init-school-db.sql:/docker-entrypoint-initdb.d/01-init-school.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d school_sell_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - college-network

  college_db:
    image: postgres:15-alpine
    container_name: college-management-college-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: college_sell_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - college_db_data:/var/lib/postgresql/data
      - ./scripts/init-college-db.sql:/docker-entrypoint-initdb.d/02-init-college.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d college_sell_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      school_db:
        condition: service_healthy
    networks:
      - college-network

  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: college-management-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - college-network

  # Application service
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: college-management-web
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@school_db:5432/school_sell_db
      COLLEGE_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@college_db:5432/college_sell_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis}@redis:6379
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      FEATURE_COLLEGE_MODULE: ${FEATURE_COLLEGE_MODULE:-true}
      FEATURE_ADVANCED_LOGGING: ${FEATURE_ADVANCED_LOGGING:-true}
      FEATURE_METRICS_ENABLED: ${FEATURE_METRICS_ENABLED:-true}
      FEATURE_RATE_LIMITING: ${FEATURE_RATE_LIMITING:-true}
    ports:
      - "8000:8000"
    depends_on:
      school_db:
        condition: service_healthy
      college_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - college-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Nginx reverse proxy with SSL termination
  nginx:
    image: nginx:alpine
    container_name: college-management-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
    networks:
      - college-network

  # Monitoring stack
  prometheus:
    image: prom/prometheus:latest
    container_name: college-management-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - college-network

  grafana:
    image: grafana/grafana:latest
    container_name: college-management-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - college-network

volumes:
  school_db_data:
    driver: local
  college_db_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  college-network:
    driver: bridge
