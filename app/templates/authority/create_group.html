{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h3>Create New Group</h3>
        </div>
        <div class="card-body">
            <form action="/authority/groups/create" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">

                <div class="mb-3">
                    <label for="name" class="form-label">Group Name</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <label for="type" class="form-label">Group Type</label>
                    <select class="form-control" id="type" name="type">
                        <option value="academic">Academic</option>
                        <option value="extracurricular">Extracurricular</option>
                        <option value="announcement">Announcement Only</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success">Create Group</button>
                <a href="/authority/groups" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
