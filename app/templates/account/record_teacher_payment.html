{% extends "base.html" %}

{% block title %}Record Teacher Payment{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4>Record Teacher Payment</h4>
                </div>
                <div class="card-body">
                    {% if success %}
                        <div class="alert alert-success">
                            {{ message }}
                        </div>
                    {% endif %}
                    
                    <form method="post" action="/account/record-payment">
                        <div class="mb-3">
                            <label for="teacher_id" class="form-label">Teacher</label>
                            <select class="form-control" id="teacher_id" name="teacher_id" required>
                                <option value="">Select Teacher</option>
                                {% for teacher in teachers %}
                                    <option value="{{ teacher.id }}">{{ teacher.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="amount" class="form-label">Amount (₹)</label>
                            <input type="number" step="0.01" min="0" 
                                   class="form-control" id="amount" name="amount" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="month" class="form-label">Month (YYYY-MM)</label>
                            <input type="text" class="form-control" id="month" 
                                   name="month" pattern="\d{4}-\d{2}" 
                                   placeholder="2024-01" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="payment_type" class="form-label">Payment Type</label>
                            <select class="form-control" id="payment_type" name="payment_type">
                                <option value="salary">Salary</option>
                                <option value="bonus">Bonus</option>
                                <option value="allowance">Allowance</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="notes" class="form-label">Notes (Optional)</label>
                            <textarea class="form-control" id="notes" name="notes" rows="2"></textarea>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Record Payment</button>
                            <a href="/account/dashboard" class="btn btn-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
