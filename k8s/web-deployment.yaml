apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-management-web
  namespace: college-management
  labels:
    app: college-management-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: college-management-web
  template:
    metadata:
      labels:
        app: college-management-web
    spec:
      containers:
      - name: web
        image: college-management:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: college-management-config
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: college-management-secrets
              key: SECRET_KEY
        - name: SENTRY_DSN
          valueFrom:
            secretKeyRef:
              name: college-management-secrets
              key: SENTRY_DSN
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: college-management-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: college-management-secrets
              key: REDIS_PASSWORD
        - name: DATABASE_URL
          value: "postgresql://postgres:$(POSTGRES_PASSWORD)@school-postgres:5432/school_sell_db"
        - name: COLLEGE_DATABASE_URL
          value: "postgresql://postgres:$(POSTGRES_PASSWORD)@college-postgres:5432/college_sell_db"
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@redis:6379"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
---
apiVersion: v1
kind: Service
metadata:
  name: college-management-web
  namespace: college-management
  labels:
    app: college-management-web
spec:
  selector:
    app: college-management-web
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: college-management-web-hpa
  namespace: college-management
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: college-management-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60