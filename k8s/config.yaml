apiVersion: v1
kind: Namespace
metadata:
  name: college-management
  labels:
    name: college-management
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: college-management-config
  namespace: college-management
data:
  ENVIRONMENT: "production"
  ALLOWED_ORIGINS: "https://your-domain.com,https://admin.your-domain.com"
  FEATURE_COLLEGE_MODULE: "true"
  FEATURE_ADVANCED_LOGGING: "true"
  FEATURE_METRICS_ENABLED: "true"
  FEATURE_RATE_LIMITING: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: college-management-secrets
  namespace: college-management
type: Opaque
data:
  # Base64 encoded values - replace with actual secrets
  SECRET_KEY: "Y2hhbmdlLXRoaXMtaW4tcHJvZHVjdGlvbg=="  # change-this-in-production
  SENTRY_DSN: ""  # Add your Sentry DSN
  POSTGRES_PASSWORD: "cG9zdGdyZXM="  # postgres
  REDIS_PASSWORD: "cmVkaXM="  # redis
  GRAFANA_PASSWORD: "YWRtaW4="  # admin
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: school-db-pvc
  namespace: college-management
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: college-db-pvc
  namespace: college-management
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: college-management
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi